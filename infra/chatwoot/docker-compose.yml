# NODOS Inbox: Chatwoot Community Edition (MIT, gratis) + asistente de NODOS.
# Pensado para una VM Always Free de Oracle Cloud (ARM, 2 OCPU / 12 GB) con Ubuntu.
# Uso: ver README.md. Nada de este archivo lleva secretos: van en .env.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0-ce}
  env_file: .env
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  volumes:
    - storage_data:/app/storage
  depends_on:
    - postgres
    - redis
  restart: unless-stopped

services:
  chatwoot-rails:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot-sidekiq:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  # Asistente de NODOS (Agent Bot por webhook). Solo es accesible desde la red
  # interna: Chatwoot le manda los eventos a http://nodos-bot:4000/webhook
  nodos-bot:
    build: ./bot
    restart: unless-stopped
    environment:
      - CHATWOOT_URL=http://chatwoot-rails:3000
      - CHATWOOT_BOT_TOKEN=${CHATWOOT_BOT_TOKEN:-}
      - CHATWOOT_BOT_SECRET=${CHATWOOT_BOT_SECRET:-}

  # HTTPS automático (Let's Encrypt) para chat.nodoscompliance.com
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CHAT_DOMAIN=${CHAT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - chatwoot-rails

volumes:
  storage_data:
  postgres_data:
  redis_data:
  caddy_data:
